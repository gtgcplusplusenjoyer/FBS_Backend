services:
  postgres:
    container_name: postgres
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: FbsDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  fbs_api:
    container_name: fbs_api
    build: .
    restart: always
    ports:
      - "5067:5067"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5067
      - ConnectionStrings__FbsDbContext=Host=postgres;Port=5432;Database=FbsDB;Username=postgres;Password=123456
      - AuthSettings__SecretKey=mysecretKeyfwgfwefewefnLwewfnwoenvoiwiwenvoiwiwenvoiwnwoieivnwoineivnonw
      - AuthSettings__Expires=00:02:00