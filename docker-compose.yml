services:
  postgres:
    container_name: postgres
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # ← берём из .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  fbs_api:
    container_name: fbs_api
    build: .
    restart: always
    ports:
      - "5067:5067"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5067
      - ConnectionStrings__FbsDbContext=${DATABASE_URL}
      - AuthSettings__SecretKey=${JWT_SECRET_KEY}
      - AuthSettings__Expires=${AUTH_EXPIRES}