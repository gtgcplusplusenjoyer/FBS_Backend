version: "3.9"

services:
  postgres:
    container_name: postgres
    image: postgres:latest
    environment:
      POSTGRES_DB: FbsDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  fbs_api:
    container_name: fbs_api
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__FbsDbContext=Host=postgres;Port=5432;Database=FbsDB;Username=postgres;Password=123456
    ports:
      - "5067:5067"
      - "7214:7214"
volumes:
  postgres-data: